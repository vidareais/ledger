[project]
name = "ledger"
version = "0.1.0"
description = "A pure-Python envelope-budgeting engine: ledger-first, deterministic, and UI-free"
readme = "README.md"
authors = [
    { name = "tarcisio", email = "20189+tarcisio@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
]

[project.scripts]
ledger = "ledger:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ledger --cov-report=term-missing:skip-covered --cov-report=html --cov-report=json"

[tool.coverage.run]
source = ["ledger"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
title = "Cobertura — supera"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
